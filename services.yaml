build_map:
  name: Build Map
  description: Perform a fast map build without cleaning
  target:
    entity:
      domain: vacuum

empty_dust:
  name: Empty Dust Bin
  description: Force the dust bin to be emptied
  target:
    entity:
      domain: vacuum

request_all_data:
  name: Request All Data
  description: Request all data like the official app does
  target:
    entity:
      domain: vacuum

request_map:
  name: Request Map
  description: Request the current map
  target:
    entity:
      domain: vacuum

clean_room_with_preset:
  name: Clean Room With Preset
  description: Clean a room using saved preset settings from the map
  target:
    entity:
      domain: vacuum
  fields:
    room:
      name: Room Name
      description: Name of the room to clean
      required: true
      example: "Living Room"
      selector:
        text:
    use_preset:
      name: Use Preset
      description: Use saved preset settings (fan speed, water level from map)
      required: false
      default: true
      selector:
        boolean:

restore_reference_map:
  name: Restore Reference Map
  description: Restore room configuration from reference map
  target:
    entity:
      domain: vacuum
  fields:
    room_names:
      name: Room Names
      description: Restore room names from reference (true/false)
      required: false
      default: true
      selector:
        boolean:
    room_presets:
      name: Room Presets
      description: Restore room presets from reference (true/false)
      required: false
      default: true
      selector:
        boolean:

compare_with_reference:
  name: Compare With Reference
  description: Compare current map with reference map
  target:
    entity:
      domain: vacuum
  fields:
    show_details:
      name: Show Details
      description: Show detailed comparison
      required: false
      default: false
      selector:
        boolean:

cleanup_maps:
  name: Clean Up Maps
  description: Remove old realtime maps and their metadata
  target:
    entity:
      domain: vacuum
  fields:
    keep_last:
      name: Keep Last
      description: Number of most recent maps to keep
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1
          mode: slider

force_load_history:
  name: Force Load History
  description: Force load all clean history maps and generate PNGs
  target:
    entity:
      domain: vacuum

vacuum_clean_zone:
  name: Clean Zone (Xiaomi Miio Compatible)
  description: Start zone cleaning (compatible with xiaomi-vacuum-map-card)
  fields:
    entity_id:
      name: Vacuum Entity
      description: Vacuum entity to control
      required: true
      example: "vacuum.neatsvor_vacuum"
      selector:
        entity:
          domain: vacuum
    zones:
      name: Zones
      description: List of zones to clean, each zone = [x1, y1, x2, y2, repeats]
      required: true
      example: "[[100, 100, 500, 500, 1]]"
      selector:
        object: {}
        
set_reference_map:
  name: Set Reference Map
  description: Set the current map as the reference map
  target:
    entity:
      domain: vacuum

use_cloud_map:
  name: Use Cloud Map
  description: Use a specific cloud map as the current map on the robot
  fields:
    map_id:
      name: Map ID
      description: ID of the cloud map to use
      required: true
      example: "123456"
      selector:
        number:
          min: 1
          max: 999999999
    map_url:
      name: Map URL
      description: URL of the map file (dev_map_url from sensor)
      required: true
      example: "https://example.com/map.bv"
      selector:
        text:
    map_md5:
      name: Map MD5
      description: MD5 hash of the map file (dev_map_md5 from sensor)
      required: true
      example: "d41d8cd98f00b204e9800998ecf8427e"
      selector:
        text:

use_selected_cloud_map:
  name: Use Selected Cloud Map
  description: Use the currently selected cloud map as the current map on the robot
  target:
    entity:
      domain: vacuum

cleanup_history_maps:
  name: Cleanup History Maps
  description: Remove old history maps, keeping only the specified number
  target:
    entity:
      domain: vacuum
  fields:
    keep_last:
      name: Keep Last
      description: Number of most recent history maps to keep
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: slider

cleanup_all_except_current:
  name: Cleanup All Except Current
  description: Remove all history maps except the currently selected one
  target:
    entity:
      domain: vacuum

force_update_maps:
  name: Force Update Maps
  description: Force update all map-related sensors
  target:
    entity:
      domain: vacuum

save_select_states:
  name: Save Select States
  description: Save the current state of all select entities
  target:
    entity:
      domain: vacuum

restore_select_states:
  name: Restore Select States
  description: Restore the saved state of all select entities
  target:
    entity:
      domain: vacuum